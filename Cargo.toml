[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "platform/*", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["Benjamin Pannell <benjamin@pannell.dev>"]
repository = "https://github.com/SierraSoftworks/letters"
publish = false

[workspace.dependencies]
letters-model = { path = "crates/letters-model" }
letters-format = { path = "crates/letters-format" }
letters-render = { path = "crates/letters-render" }
letters-fonts = { path = "crates/letters-fonts" }
letters-layout = { path = "crates/letters-layout" }
letters-editor = { path = "crates/letters-editor" }
letters-ui = { path = "crates/letters-ui" }
letters-convert = { path = "crates/letters-convert" }
letters-spell = { path = "crates/letters-spell" }
letters-math = { path = "crates/letters-math" }
letters-trust = { path = "crates/letters-trust" }
letters-api = { path = "crates/letters-api" }
letters-sync = { path = "crates/letters-sync" }
letters-test = { path = "crates/letters-test" }
# The one crate with unsafe code. Only the desktop shell may name it.
letters-frame = { path = "platform/letters-frame" }

serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
proptest = "1"
unicode-segmentation = "1"
# Finds text by a pattern, in time that grows only with the text. Pure Rust, and already under the maths engine.
regex = "1"
# The CRDT behind letters-model. No other crate may name it.
loro = { version = "1.18", default-features = false }
# The checksum Loro seals a history with. Only the fuzz targets name it, to seal the histories they try.
xxhash-rust = { version = "0.8", features = ["xxh32"] }
jsonschema = { version = "0.61", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
vello_cpu = "0.4"
vello_gpu = "0.4"
# The version vello_gpu is built against.
wgpu = "30"
pollster = "1"
# The glyph renderer inside vello_cpu and vello_gpu: same version as theirs.
glifo = { version = "0.5", default-features = false, features = ["std"] }
# The font reader inside glifo: same version as its.
skrifa = "0.49"
bytemuck = "1"
# Writes PDF: font subsets, text that can be selected, outlines and links. Without its own text shaping.
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
# Small fonts of every glyph format, by skrifa's authors. For tests of colour glyphs.
font-test-data = "0.10"
# Reads and draws PDF, by krilla's authors. For tests of what letters-render writes.
hayro = "0.9"
# Text shaping and line breaking. No system fonts: only the bundled faces are registered.
parley = { version = "0.13", default-features = false, features = ["std"] }
# The Unicode properties parley itself reads, for telling which characters no font covers: same version as its.
parley_data = "0.13"
# The classes parley_data answers in, for telling which side a text reads from: the version parley_data has.
icu_properties = { version = "2.3", default-features = false }
# The segmenter parley breaks lines with, its data provider and the type its word lists are read as, for
# handing parley a list while the program runs: the versions parley has, which asks for this very minor one.
icu_segmenter = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
icu_provider = { version = "2.4", default-features = false }
zerovec = { version = "0.11", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
# Tokenizes clipboard HTML. No dependencies of its own.
html5gum = "0.9"
# Reads the XML inside a .docx. Read-only, no dependencies of its own.
roxmltree = "0.21"
# Reads Hunspell dictionaries. MPL-2.0, used unmodified.
spellbook = "0.4"
# yewi's highlighter. Its own lexers need no dependencies; the `syntect` feature adds grammars and weight.
yewi-highlight = "0.3"
yewi-tokens = "0.3"
# The accessibility tree's types: plain data, shared by the widgets, the shell and the test harness.
accesskit = "0.25"
accesskit_consumer = "0.39"
# The maths engine, KaTeX-compatible and pure Rust. Only letters-math may name it.
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
ratex-font = "0.1.15"
# Edits the user's settings file and keeps their comments and layout.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

# The desktop shell. None of these may reach the core crates.
winit = "0.30"
softbuffer = "0.4"
accesskit_winit = "0.34"
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
rfd = "0.17"
# Lists the system's font files and their families, in Rust alone. For what the bundled fonts cannot draw.
fontdb = "0.24"
# Moves a merged conflict copy to the system's trash, where the person can still take it back.
trash = "5.3"
# The desktop shell fetches linked pictures with it: no cookies, no proxies, the system's own roots.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# A server for the fetch's tests.
rcgen = "0.14"
# Reports which features are used and how long sessions last, to a privacy-preserving analytics server.
# Only its Analytics battery: no Sentry, no OpenTelemetry. It is published through git alone.
tracing-batteries = { git = "https://github.com/SierraSoftworks/tracing-batteries-rs.git", default-features = false, features = ["analytics"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The system's own word on a server's certificate, for the socket to a Letters server. ureq brings it too.
rustls-platform-verifier = "0.7"
# Keeps a server's sign-in in the system's keychain: Keychain on macOS, Credential Manager on Windows, the
# Secret Service elsewhere.
keyring = "4"
# What keyring is built on, named so that tests can keep sign-ins in memory and not in a real keychain.
keyring-core = "1"
# The socket a document syncs over in connected mode. It speaks over the TLS the shell sets up itself.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Already in the tree through accesskit. Linux only: it asks the desktop for its settings.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Replaces the running program with a newer release from GitHub, by Sierra Softworks. It brings reqwest.
update-rs = "0.4"
# The versions update-rs compares releases by: the version it has.
semver = "1"
# The menu bar on macOS, by Tauri's authors: winit has none beyond its default. macOS only, so no GTK.
muda = { version = "0.21", default-features = false }
getrandom = "0.4"
# What the server keeps of a share link's passphrase, so that whoever reads its store guesses slowly.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# The person's time zone, for the dates the landing card shows. No time zone reaches the core.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Older system dictionaries are not in UTF-8. The app reads them: nothing in the core needs this.
encoding_rs = "0.8"

# What letters-frame calls the desktop with, in the versions winit and softbuffer already bring.
raw-window-handle = "0.6"
wayland-client = "0.31"
# Loaded when a window turns out to be a Wayland one, as winit does: nothing links against it.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
memmap2 = "0.9"
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
# Puts the icon, the version and the manifest into the Windows program, with the system's own compiler.
winresource = { version = "0.1", default-features = false }
# Windows, in the version winit brings. The features are what letters-frame asks of the system itself.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Authentication_Identity", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSProcessInfo", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSImage", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSToolbar", "NSView", "NSWindow"] }

# The server. None of these may reach the core crates.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json", "form", "multipart", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
# The state directory: one file, in Rust alone, with no server of its own.
redb = "4"
# Opens files beneath a folder and nowhere else, whatever a path or a symlink says.
cap-std = "4"
# Checks the identity provider's signature on an ID token, in Rust alone.
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
toml = "1"
# The server's own pages: yewi components drawn where they are served, so that no wasm goes to the browser.
yew = { version = "0.23", default-features = false, features = ["ssr"] }
yewi = { version = "0.3", features = ["ssr", "fonts"] }
# Drives the server's routes in its tests with no socket between.
tower = { version = "0.5", default-features = false, features = ["util"] }
# The browser's editor is compiled into the server in brotli, made when the server is built. In Rust alone.
brotli = "8"
# For the browser that asks for a file of the editor and does not read brotli.
brotli-decompressor = "5"
http-body-util = "0.1"

# The browser shell. The command-line `wasm-bindgen` must be the version the lock file names.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "allow"

[profile.dev]
debug = "line-tables-only"
# Each test binary links the whole tree, and incremental state and dependency debug info filled 30 GB disks.
incremental = false

[profile.dev.package."*"]
debug = false

# ICU writes a line to stderr for every stretch of Thai or CJK text it segments without a dictionary, but
# only where debug assertions are on. A release build says nothing, and so a debug build does not either.
[profile.dev.package.icu_provider]
debug = false
debug-assertions = false

# The server's build compresses the browser's editor once, as small as it goes. Unoptimised, that takes
# minutes, and a build script is not optimised unless it is said here.
[profile.dev.package.brotli]
opt-level = 3

# Slow by design, and unoptimised a hundred times slower still: a test that opens a link with a passphrase
# would wait seconds on each try.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Loro's debug assertions hold for histories Loro wrote. One from anywhere else can fail them, and a panic
# inside an import leaves the document's locks poisoned, so the process aborts. A release build has no such
# assertions and reads the same bytes as an update, and so a debug build does too.
[profile.dev.package.loro-internal]
debug = false
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.package.brotli]
opt-level = 3

# What a server is built with: `cargo build --profile server -p letters-server`. It has many people's
# documents open at once, and closes the one a panic came from and keeps the others. Where a panic aborts,
# as in the apps, it would end them all.
[profile.server]
inherits = "release"
panic = "unwind"

# What scripts/fuzz builds: quick to link, and a panic names its line.
[profile.fuzz]
inherits = "release"
lto = false
debug = "line-tables-only"
# A target may catch a panic of code it cannot make refuse, as `Model::check` does with Loro's.
panic = "unwind"

# The browser's wasm is downloaded before it runs, so it is built small, except where a frame is made:
# shaping, layout and painting keep their speed. Measured at 17% less to download for the same frame times.
[profile.web]
inherits = "release"
opt-level = "z"

[profile.web.package]
letters-editor.opt-level = 3
letters-layout.opt-level = 3
letters-render.opt-level = 3
letters-ui.opt-level = 3
color.opt-level = 3
fearless_simd.opt-level = 3
fontique.opt-level = 3
glifo.opt-level = 3
harfrust.opt-level = 3
kurbo.opt-level = 3
parley.opt-level = 3
parley_engine.opt-level = 3
peniko.opt-level = 3
read-fonts.opt-level = 3
skrifa.opt-level = 3
vello_common.opt-level = 3
vello_cpu.opt-level = 3
