[package]
name = "letters-render"
description = "The display list and its backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["pdf"]
# The PDF backend. A shell that never exports can leave it and its PDF writer out.
pdf = ["dep:krilla"]
# The GPU backend. The shell turns it on, so the wasm-clean core never builds it.
gpu = ["dep:vello_gpu", "dep:wgpu"]
# Pixel snapshots for tests. They read and write files, which the core must not.
snapshot = []

[dependencies]
bytemuck.workspace = true
glifo.workspace = true
image.workspace = true
krilla = { workspace = true, optional = true }
skrifa.workspace = true
vello_cpu.workspace = true
vello_gpu = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
font-test-data.workspace = true
hayro.workspace = true
# A decoder the crate leaves out, as a shell's dependencies can add one, for the test that it is refused.
image = { workspace = true, features = ["bmp"] }
letters-fonts.workspace = true
# Turns the snapshot feature on for this crate's own tests.
letters-render = { workspace = true, features = ["pdf", "snapshot"] }
pollster.workspace = true
