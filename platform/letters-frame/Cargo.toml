[package]
name = "letters-frame"
description = "The native window calls winit does not make: the one crate of Letters that may use unsafe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# Not the workspace's lints, which forbid unsafe code. Here it is allowed, and every block says why it holds.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
raw-window-handle.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wayland-client.workspace = true
wayland-backend.workspace = true
memmap2.workspace = true
rustix.workspace = true
bytemuck.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
