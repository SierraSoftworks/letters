[package]
name = "letters"
description = "The Letters desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
letters-model.workspace = true
letters-render = { workspace = true, features = ["gpu"] }
letters-editor.workspace = true
letters-ui.workspace = true
letters-format.workspace = true
letters-convert.workspace = true
letters-fonts = { workspace = true, features = ["library"] }
letters-layout = { workspace = true, features = ["dictionaries"] }
letters-trust.workspace = true
letters-spell.workspace = true
letters-frame.workspace = true
letters-api.workspace = true
letters-sync.workspace = true
serde.workspace = true
serde_json.workspace = true

winit.workspace = true
softbuffer.workspace = true
accesskit_winit.workspace = true
arboard.workspace = true
rfd.workspace = true
fontdb.workspace = true
trash.workspace = true
skrifa.workspace = true
getrandom.workspace = true
sha2.workspace = true
jiff.workspace = true
encoding_rs.workspace = true
toml_edit.workspace = true
image.workspace = true
ureq.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
tungstenite.workspace = true
keyring.workspace = true
keyring-core.workspace = true
pollster.workspace = true
# The runtime the reports are sent on, kept to the telemetry thread.
tracing-batteries.workspace = true
tokio.workspace = true
update-rs.workspace = true
semver.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus.workspace = true

# Draws the pages of a PDF for a printer, which Windows is sent as pictures. In Rust alone.
[target.'cfg(windows)'.dependencies]
hayro.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
letters-frame = { workspace = true, features = ["probe"] }
letters-server = { path = "../letters-server" }
axum.workspace = true
hayro.workspace = true
rcgen.workspace = true
