[package]
name = "letters-server"
description = "The Letters server: identity, spaces and sync over folders it does not own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
letters-api.workspace = true
letters-model.workspace = true
letters-format.workspace = true
letters-sync.workspace = true
letters-editor.workspace = true
letters-trust.workspace = true
letters-spell.workspace = true
# The read view: a document as HTML, in the window's dark colours where the reader asks for them.
letters-convert.workspace = true
letters-ui.workspace = true
letters-fonts.workspace = true
# A PDF is laid out here as the window lays it out, with the word lists that end a line of Thai or
# Chinese between words.
letters-layout = { workspace = true, features = ["dictionaries"] }
letters-render.workspace = true
# Markdown goes out with its pictures in one file.
zip.workspace = true
# The page a document is sent to a browser in. The editor that page runs is compiled in by the build
# script, from what `apps/letters-web/build.sh` made.
letters-web = { path = "../letters-web" }
brotli-decompressor.workspace = true
# Presses the dictionaries of other languages, which the owner adds after the build.
brotli.workspace = true
encoding_rs.workspace = true

axum.workspace = true
tokio.workspace = true
redb.workspace = true
cap-std.workspace = true
toml.workspace = true
jsonwebtoken.workspace = true
ureq.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
argon2.workspace = true
getrandom.workspace = true
jiff.workspace = true
yew.workspace = true
yewi.workspace = true
# Reports which features are asked for and how long the server runs. See src/telemetry.rs.
tracing-batteries.workspace = true

[build-dependencies]
brotli.workspace = true

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tungstenite.workspace = true
# A small face of Hebrew, for a PDF that is set in a face from the state directory.
font-test-data.workspace = true
# A site for the server's fetches to be tried against.
rcgen.workspace = true
rustls.workspace = true
