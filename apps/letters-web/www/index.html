<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- A server says here where the files below are, and names the page after its document. -->
    <!--letters:base-->
    <title>Letters</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <!-- What the editor's first frame needs is asked for at once, not each when the one before has arrived. -->
    <link rel="modulepreload" href="start.js" />
    <link rel="modulepreload" href="letters.js" />
    <link rel="preload" as="fetch" crossorigin href="letters_bg.wasm" />
    <!-- The text of the first paint and the editor's first frame are waiting for this one. The other fonts
         are asked for when the editor starts, so that they do not hold up what it waits for. -->
    <link rel="preload" as="fetch" crossorigin fetchpriority="high" href="fonts/Inter.ttf" />
    <!-- The build writes in here what this document's first frame waits for besides: the maths faces, if it has maths. -->
    <!--letters:preload-->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      /* The page sizes the canvas. The editor reads the size and paints to fit. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="letters"></canvas>
    <!-- The build writes the document in here twice, as a server would: to read at once under the shapes of
         the window's controls, and to open. -->
    <!--letters:first-paint-->
    <!--letters:document-->
    <!-- A server writes in here what it says of the document: who writes in it, and what they may do. -->
    <!--letters:opened-->
    <!-- The page's one script is a file, so that a server's policy need let no inline script run. -->
    <script type="module" src="start.js"></script>
  </body>
</html>
