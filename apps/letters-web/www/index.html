<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Letters</title>
    <!-- Everything the editor needs is asked for at once, not each when the one before has arrived. -->
    <link rel="modulepreload" href="letters.js" />
    <link rel="preload" as="fetch" crossorigin href="letters_bg.wasm" />
    <link rel="preload" as="fetch" crossorigin href="fonts/Inter.ttf" />
    <link rel="preload" as="fetch" crossorigin href="fonts/Inter-Italic.ttf" />
    <link rel="preload" as="fetch" crossorigin href="fonts/FiraCode.ttf" />
    <link rel="preload" as="fetch" crossorigin href="fonts/Montserrat.ttf" />
    <link rel="preload" as="fetch" crossorigin href="fonts/Montserrat-Italic.ttf" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      /* The page sizes the canvas. The editor reads the size and paints to fit. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      /* The document as HTML, over the canvas until the editor has painted it there. */
      #letters-first-paint {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: white;
      }
    </style>
  </head>
  <body>
    <canvas id="letters"></canvas>
    <!-- The build writes the document in here twice, as a server would: to read at once, and to open. -->
    <!--letters:first-paint-->
    <!--letters:document-->
    <script type="module">
      import init, { Letters } from "./letters.js";

      await init();
      // The console and the tests reach the editor here.
      window.letters = await Letters.start(document.getElementById("letters"), "fonts/");
    </script>
  </body>
</html>
