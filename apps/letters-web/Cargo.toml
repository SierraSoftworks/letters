[package]
name = "letters-web"
description = "The Letters browser shell: the engine on a canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The browser loads the `cdylib`. Tests link the `rlib`.
crate-type = ["cdylib", "rlib"]

[dependencies]
letters-model.workspace = true
letters-render.workspace = true
# Reads which characters a fetched face has. The renderer links it already.
skrifa.workspace = true
letters-editor.workspace = true
letters-ui.workspace = true
letters-fonts.workspace = true
# The faces a style can ask for, and the hash a font file is named by. The editor links both already.
letters-layout.workspace = true
sha2.workspace = true
letters-math.workspace = true
letters-spell.workspace = true
letters-trust.workspace = true
# What the server behind a page says, and where it is asked.
letters-api.workspace = true
serde_json.workspace = true
# The document's line to its server: what to send over the page's socket, and what to merge.
letters-sync.workspace = true

accesskit.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "Blob",
  "BinaryType",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "ClipboardEvent",
  "CompositionEvent",
  "Crypto",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DragEvent",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "ImageBitmap",
  "Headers",
  "ImageData",
  "InputEvent",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MessageEvent",
  "MouseEvent",
  "Navigator",
  "Node",
  "Performance",
  "PointerEvent",
  "RequestInit",
  "Response",
  "Storage",
  "Url",
  "WebSocket",
  "WheelEvent",
  "Window",
  "console",
] }

# A page's first paint is the document's HTML export, which a server writes when it builds the page. The
# browser's own build does not carry the export.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
letters-convert.workspace = true

# The exports are a module of their own, which the page fetches when the person first prints or saves a copy.
[[example]]
name = "export"
crate-type = ["cdylib"]

[dev-dependencies]
letters-format.workspace = true
letters-test.workspace = true
zip.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
letters-convert.workspace = true

# The `server` example runs the server itself behind the page. Nothing of it is built for the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
letters-server = { path = "../letters-server" }
axum.workspace = true
tokio.workspace = true

# The browser fetches the fonts, the maths faces and the dictionaries beside the wasm, so they are cached
# apart from it and only the fonts hold up the first frame. Only the wasm build leaves them out: a feature
# named here for every target would take them from the native tests too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
letters-fonts = { workspace = true, features = ["provided"] }
letters-math = { workspace = true, features = ["provided"] }
letters-spell = { workspace = true, features = ["provided"] }
