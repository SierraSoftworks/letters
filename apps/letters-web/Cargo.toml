[package]
name = "letters-web"
description = "The Letters browser shell: the engine on a canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The browser loads the `cdylib`. Tests link the `rlib`.
crate-type = ["cdylib", "rlib"]

[dependencies]
letters-model.workspace = true
letters-render.workspace = true
letters-editor.workspace = true
letters-ui.workspace = true
letters-fonts.workspace = true
letters-math.workspace = true
letters-spell.workspace = true

accesskit.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "ClipboardEvent",
  "CompositionEvent",
  "Crypto",
  "CssStyleDeclaration",
  "DataTransfer",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlIFrameElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "ImageData",
  "InputEvent",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "Performance",
  "PointerEvent",
  "Response",
  "Storage",
  "Url",
  "WheelEvent",
  "Window",
  "console",
] }

[dev-dependencies]
# The harness page's first paint is the document's HTML export, written when the page is built.
letters-convert.workspace = true

# The browser fetches the fonts, the maths faces and the dictionaries beside the wasm, so they are cached
# apart from it and only the fonts hold up the first frame. Only the wasm build leaves them out: a feature
# named here for every target would take them from the native tests too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
letters-fonts = { workspace = true, features = ["provided"] }
letters-math = { workspace = true, features = ["provided"] }
letters-spell = { workspace = true, features = ["provided"] }
