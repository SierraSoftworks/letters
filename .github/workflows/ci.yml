name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Each night as well: a cache nobody reads for a week is dropped, and the next push would build everything.
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main come minutes apart. One run at a time, and of those waiting only the newest: every run
# checks main as it stands, and none is cut off half way.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Nothing here reads debug info: a failed test names its line without it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The gate of scripts/check.sh, its steps side by side.
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            key: Lint
            check: fmt lint
          - name: Wasm
            key: Wasm
            check: wasm
          # The gate's `cargo test --workspace` as three jobs of about one length, since building and running
          # the tests is most of a push. The last takes every crate the others do not name, new ones too.
          - name: Test (model, layout, render)
            key: test-model
            test: -p letters-model -p letters-layout -p letters-render
          - name: Test (editor, window)
            key: test-window
            test: -p letters-editor -p letters-test
          - name: Test (the rest)
            key: test-rest
            test: >-
              --workspace --exclude letters-model --exclude letters-layout --exclude letters-render
              --exclude letters-editor --exclude letters-test
    steps:
      - uses: actions/checkout@v7

      # The version rust-toolchain.toml pins, with its components and targets.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check
        if: matrix.check
        run: ./scripts/check.sh ${{ matrix.check }}

      # A step of its own, so that the run shows what building costs and what testing does.
      - name: Build tests
        if: matrix.test
        run: cargo test ${{ matrix.test }} --no-run

      - name: Test
        if: matrix.test
        run: cargo test ${{ matrix.test }}

  # The launch and keystroke budgets, on a release build.
  budgets:
    name: Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: budgets
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release -p letters

      # The launch budget is about a window, so it is measured in one, on a display in memory. The CPU
      # renderer, since the runner has no GPU to speak of.
      - name: Install a display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb libxkbcommon-x11-0

      - name: Check budgets
        shell: bash
        env:
          LETTERS_RENDERER: cpu
        run: |
          xvfb-run -a -s "-screen 0 1400x1000x24" ./scripts/budgets.sh --window ubuntu-latest | tee budgets.txt
          { echo '```text'; cat budgets.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # The tests that are too slow for every push, each night and when asked for.
  slow:
    name: Slow tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: slow
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The window tests type into a real window, on a display in memory.
      - name: Install a session bus and a display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dbus-daemon xvfb xauth libxkbcommon-x11-0 xdotool

      - name: Test
        run: ./scripts/check.sh slow

  # The server as it ships: its own profile, with the browser's editor compiled in, as one file that asks
  # nothing of the system it is copied to. Nothing else builds it, and thin LTO on one codegen unit takes
  # minutes, so each night and when asked for.
  server:
    name: Server build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVER_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      # The target is this job's alone, so rust-toolchain.toml does not name it.
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$SERVER_TARGET"

      # The C in `ring` is built by the target's own compiler.
      - name: Install the musl compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the browser's editor
        run: ./apps/letters-web/build.sh

      - name: Build
        env:
          LETTERS_WEB_DIST: ${{ github.workspace }}/apps/letters-web/dist
        run: cargo build --profile server -p letters-server --target "$SERVER_TARGET"

      # A file that names a loader or a library of the system's would not start where those are missing.
      - name: Check that it is static
        shell: bash
        run: |
          asks=$(readelf --program-headers --dynamic "target/$SERVER_TARGET/server/letters-server")
          if grep -E 'INTERP|NEEDED' <<<"$asks"; then
            echo "::error::the server is not a static file"
            exit 1
          fi

      # The least a server must do: read its settings and say they are sound.
      - name: Check that it starts
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/letters.toml" <<EOF
          [server]
          name = "Smoke"
          url = "https://letters.example.test"
          state = '$RUNNER_TEMP/state'

          [auth.oidc]
          issuer = "https://id.example.test"
          client_id = "letters"

          [[space]]
          name = "Home"
          path = '$RUNNER_TEMP/home/{username}'
          EOF
          "target/$SERVER_TARGET/server/letters-server" --check --config "$RUNNER_TEMP/letters.toml"

  # What layout costs a frame. The bench holds its own budgets and fails when a measurement is over one.
  bench:
    name: Layout bench
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo bench -p letters-layout --no-run

      - name: Bench
        shell: bash
        run: |
          cargo bench -p letters-layout | tee bench.txt
          { echo '```text'; cat bench.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
