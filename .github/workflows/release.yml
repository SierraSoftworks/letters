name: Release

# Releases are cut by running this workflow by hand and choosing which part of the version to raise. It
# names the next version after the latest release, tags this commit, builds the desktop app for each system
# and the server at that version, and publishes all of it at once: the files go to a draft that is only
# published once every one is attached, so this works with immutable releases too.
# The app looks for its updates there (apps/letters/src/update.rs), by the names given here:
# `letters-<target>` is the program for one system, which a running Letters replaces itself with.
#
# A pull request that changes what a release is built with builds everything and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - scripts/bundle-macos.sh
      - scripts/set-version.sh
      - apps/letters/macos/**

permissions:
  contents: read

# One release at a time, and none is cut off half way.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'cut' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS the app is built for, which its Info.plist names too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # The release's tag. A pull request has none, and builds the version the repository has.
  version:
    name: Start release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # The first release counts from v0.0.0: `minor` makes it v0.1.0.
      - name: Name the release
        id: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)) minor=0 patch=0 ;;
            minor) minor=$((minor + 1)) patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "Releasing $tag (previous: $latest)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      # The token may only make a release whose tag is new while its commit is still a branch's head, and
      # main moves on during the builds. The tag is made now, and the release later attaches to it. A tag
      # that a failed run left behind is moved to this commit.
      - name: Create the release tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git push --force origin "$GITHUB_SHA:refs/tags/$TAG"

  desktop:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.tag }}
    strategy:
      matrix:
        include:
          # The oldest runners there are, so that the program asks for no newer a C library than theirs.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, kind: release }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, kind: release }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: .exe, kind: release }
          # Signed by the `macos` job before anyone is given them.
          - { os: macos-latest, target: aarch64-apple-darwin, kind: unsigned }
          - { os: macos-latest, target: x86_64-apple-darwin, kind: unsigned }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Set the version
        if: env.VERSION != ''
        shell: bash
        run: ./scripts/set-version.sh "${VERSION#v}"

      - name: Build
        run: cargo build --release -p letters --target ${{ matrix.target }}

      - name: Name the program
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/letters${{ matrix.suffix }}" "dist/letters-${{ matrix.target }}${{ matrix.suffix }}"

      # The least a release must do, and the version it will compare releases with. The Intel program is
      # built on an Apple silicon runner, which does not promise to run it.
      - name: Check that it starts
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          said=$("dist/letters-${{ matrix.target }}${{ matrix.suffix }}" --version)
          echo "$said"
          [ -z "$VERSION" ] || [ "$said" = "letters ${VERSION#v}" ]

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kind }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The Mac app: one program for both kinds of Mac in `Letters.app`, in a disk image. There is no Apple
  # developer certificate behind it, so it is signed by nobody, and macOS makes the person allow it first.
  # The README says how.
  macos:
    name: macOS app
    needs: [version, desktop]
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.tag }}
      # What the keychain knows the app by, in its bundle and as a bare program alike.
      APP_ID: com.sierrasoftworks.Letters
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: unsigned-*
          path: dist
          merge-multiple: true

      - name: Set the version
        if: env.VERSION != ''
        run: ./scripts/set-version.sh "${VERSION#v}"

      - name: Bundle
        run: |
          chmod 755 dist/letters-*
          lipo -create -output "$RUNNER_TEMP/letters" dist/letters-aarch64-apple-darwin dist/letters-x86_64-apple-darwin
          ./scripts/bundle-macos.sh "$RUNNER_TEMP/letters"

      # Sealed all the same, so that the app is one thing to macOS, which runs nothing unsigned on Apple
      # silicon.
      - name: Sign as nobody
        run: |
          codesign --force --identifier "$APP_ID" --sign - dist/letters-*
          codesign --force --sign - target/Letters.app
          codesign --verify --strict --verbose=2 target/Letters.app

      - name: Make the disk image
        run: |
          mkdir "$RUNNER_TEMP/image"
          cp -R target/Letters.app "$RUNNER_TEMP/image/"
          ln -s /Applications "$RUNNER_TEMP/image/Applications"
          hdiutil create -volname Letters -srcfolder "$RUNNER_TEMP/image" -ov -format UDZO dist/Letters.dmg

      - name: Check that it starts
        run: |
          said=$(target/Letters.app/Contents/MacOS/letters --version)
          echo "$said"
          [ -z "$VERSION" ] || [ "$said" = "letters ${VERSION#v}" ]

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The server as CI builds it each night (the `server` job of ci.yml says why each step is there), at
  # the release's version.
  server:
    name: Server
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.tag }}
      SERVER_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$SERVER_TARGET"

      - name: Install the musl compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Set the version
        if: env.VERSION != ''
        run: ./scripts/set-version.sh "${VERSION#v}"

      - name: Build the browser's editor
        run: ./apps/letters-web/build.sh

      - name: Build
        env:
          LETTERS_WEB_DIST: ${{ github.workspace }}/apps/letters-web/dist
        run: cargo build --profile server -p letters-server --target "$SERVER_TARGET"

      - name: Check that it is static
        shell: bash
        run: |
          mkdir dist
          cp "target/$SERVER_TARGET/server/letters-server" "dist/letters-server-$SERVER_TARGET"
          asks=$(readelf --program-headers --dynamic "dist/letters-server-$SERVER_TARGET")
          if grep -E 'INTERP|NEEDED' <<<"$asks"; then
            echo "::error::the server is not a static file"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-server
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # Everything or nothing: the release and the image are made once every build is there, so the app is
  # never offered a release that lacks its system's program.
  publish:
    name: Publish
    if: needs.version.outputs.tag != ''
    needs: [version, desktop, macos, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.tag }}
      SERVER_IMAGE: ghcr.io/sierrasoftworks/letters-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # The image a deployment pulls by the release's version, whole or in part: 1.2.3, 1.2 and 1.
      # `latest` stays main as CI last built it.
      - name: Publish the server's image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/image"
          cp dist/letters-server-x86_64-unknown-linux-musl "$RUNNER_TEMP/image/letters-server"
          chmod 755 "$RUNNER_TEMP/image/letters-server"
          cp /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/image/"
          version=${VERSION#v}
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GHCR_TOKEN"
          docker build --file apps/letters-server/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$SERVER_IMAGE:$version" --tag "$SERVER_IMAGE:${version%.*}" --tag "$SERVER_IMAGE:${version%%.*}" \
            "$RUNNER_TEMP/image"
          for tag in "$version" "${version%.*}" "${version%%.*}"; do docker push "$SERVER_IMAGE:$tag"; done

      # A draft, or the one a failed run left, takes every file and is published only then.
      - name: Publish the release
        id: release
        uses: SierraSoftworks/gh-releases@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release_tag: ${{ needs.version.outputs.tag }}
          create: "true"
          publish: "true"
          overwrite: "true"
          notes-template: .github/release-notes.md
          files: |
            dist/letters-x86_64-unknown-linux-gnu
            dist/letters-aarch64-unknown-linux-gnu
            dist/letters-x86_64-pc-windows-msvc.exe
            dist/letters-aarch64-apple-darwin
            dist/letters-x86_64-apple-darwin
            dist/Letters.dmg
            dist/letters-server-x86_64-unknown-linux-musl

      - run: echo "Published [${{ steps.release.outputs.tag }}](${{ steps.release.outputs.url }})" >>"$GITHUB_STEP_SUMMARY"
