name: Release

# A tag `vX.Y.Z` is a release: every crate is given that version, the desktop app is built for each system,
# and all of it is published at once as the tag's GitHub release, with the server's image beside it.
# The app looks for its updates there (apps/letters/src/update.rs), by the names given here:
# `letters-<target>` is the program for one system, which a running Letters replaces itself with.
#
# A run by hand, or for a pull request that changes what a release is built with, builds everything and
# publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-macos.sh
      - scripts/set-version.sh
      - apps/letters/macos/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS the app is built for, which its Info.plist names too.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # The tag's version. Anything else is built as the version the repository has.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          # The oldest runners there are, so that the program asks for no newer a C library than theirs.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, kind: release }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, kind: release }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: .exe, kind: release }
          # Signed by the `macos` job before anyone is given them.
          - { os: macos-latest, target: aarch64-apple-darwin, kind: unsigned }
          - { os: macos-latest, target: x86_64-apple-darwin, kind: unsigned }
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Set the version
        if: env.VERSION != ''
        shell: bash
        run: ./scripts/set-version.sh "${VERSION#v}"

      - name: Build
        run: cargo build --release -p letters --target ${{ matrix.target }}

      - name: Name the program
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/letters${{ matrix.suffix }}" "dist/letters-${{ matrix.target }}${{ matrix.suffix }}"

      # The least a release must do, and the version it will compare releases with. The Intel program is
      # built on an Apple silicon runner, which does not promise to run it.
      - name: Check that it starts
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          said=$("dist/letters-${{ matrix.target }}${{ matrix.suffix }}" --version)
          echo "$said"
          [ -z "$VERSION" ] || [ "$said" = "letters ${VERSION#v}" ]

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kind }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The Mac app: one program for both kinds of Mac in `Letters.app`, in a disk image. With the secrets
  # below it is signed with a Developer ID and notarised by Apple, and opens like any other app. Without
  # them it is signed by nobody, and macOS makes the person allow it in System Settings first.
  #
  #   APPLE_CERTIFICATE_P12        a "Developer ID Application" certificate and its key, as base64
  #   APPLE_CERTIFICATE_PASSWORD   the password of that file
  #   APPLE_API_KEY_P8             an App Store Connect API key, as base64, for the notary
  #   APPLE_API_KEY_ID             that key's ID
  #   APPLE_API_ISSUER_ID          the issuer ID of the team the key belongs to
  macos:
    name: macOS app
    needs: desktop
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # What the keychain knows the app by, in its bundle and as a bare program alike.
      APP_ID: com.sierrasoftworks.Letters
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: unsigned-*
          path: dist
          merge-multiple: true

      - name: Set the version
        if: env.VERSION != ''
        run: ./scripts/set-version.sh "${VERSION#v}"

      - name: Bundle
        run: |
          chmod 755 dist/letters-*
          lipo -create -output "$RUNNER_TEMP/letters" dist/letters-aarch64-apple-darwin dist/letters-x86_64-apple-darwin
          ./scripts/bundle-macos.sh "$RUNNER_TEMP/letters"

      # A keychain of this run's own holds the certificate, and goes with the runner.
      - name: Sign
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          base64 --decode <<<"$APPLE_CERTIFICATE_P12" >"$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::the certificate is no Developer ID Application one"; exit 1; }
          echo "SIGNED_BY=$identity" >>"$GITHUB_ENV"
          # The notary takes only programs that ask for the hardened runtime and carry a timestamp.
          codesign --force --timestamp --options runtime --identifier "$APP_ID" --sign "$identity" dist/letters-*
          codesign --force --timestamp --options runtime --sign "$identity" target/Letters.app
          codesign --verify --strict --verbose=2 target/Letters.app

      # Sealed all the same, so that the app is one thing to macOS, which runs nothing unsigned on Apple
      # silicon.
      - name: Sign as nobody
        if: env.APPLE_CERTIFICATE_P12 == ''
        run: |
          echo "::warning::no signing certificate: this app is signed by nobody, and macOS will not open it until the person allows it"
          codesign --force --identifier "$APP_ID" --sign - dist/letters-*
          codesign --force --sign - target/Letters.app

      # The notary reads the app and the bare programs in one file. Its word on the app is stapled to
      # it, for a Mac that is offline when the app is first opened. A bare program has nowhere to carry
      # one, and macOS asks Apple about it.
      - name: Notarise the app
        if: env.SIGNED_BY != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          base64 --decode <<<"$APPLE_API_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          mkdir "$RUNNER_TEMP/notary"
          cp -R target/Letters.app dist/letters-* "$RUNNER_TEMP/notary/"
          ditto -c -k "$RUNNER_TEMP/notary" "$RUNNER_TEMP/notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary.zip" --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          xcrun stapler staple target/Letters.app

      - name: Make the disk image
        run: |
          mkdir "$RUNNER_TEMP/image"
          cp -R target/Letters.app "$RUNNER_TEMP/image/"
          ln -s /Applications "$RUNNER_TEMP/image/Applications"
          hdiutil create -volname Letters -srcfolder "$RUNNER_TEMP/image" -ov -format UDZO dist/Letters.dmg

      - name: Notarise the disk image
        if: env.SIGNED_BY != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          codesign --force --timestamp --sign "$SIGNED_BY" dist/Letters.dmg
          xcrun notarytool submit dist/Letters.dmg --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          xcrun stapler staple dist/Letters.dmg

      # What Gatekeeper will say to a person who downloaded it.
      - name: Check that macOS accepts it
        if: env.SIGNED_BY != '' && env.APPLE_API_KEY_P8 != ''
        run: spctl --assess --type execute --verbose=2 target/Letters.app

      - name: Check that it starts
        run: |
          said=$(target/Letters.app/Contents/MacOS/letters --version)
          echo "$said"
          [ -z "$VERSION" ] || [ "$said" = "letters ${VERSION#v}" ]

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # The server as CI builds it each night (the `server` job of ci.yml says why each step is there), at
  # the release's version.
  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVER_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "$SERVER_TARGET"

      - name: Install the musl compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: Set the version
        if: env.VERSION != ''
        run: ./scripts/set-version.sh "${VERSION#v}"

      - name: Build the browser's editor
        run: ./apps/letters-web/build.sh

      - name: Build
        env:
          LETTERS_WEB_DIST: ${{ github.workspace }}/apps/letters-web/dist
        run: cargo build --profile server -p letters-server --target "$SERVER_TARGET"

      - name: Check that it is static
        shell: bash
        run: |
          mkdir dist
          cp "target/$SERVER_TARGET/server/letters-server" "dist/letters-server-$SERVER_TARGET"
          asks=$(readelf --program-headers --dynamic "dist/letters-server-$SERVER_TARGET")
          if grep -E 'INTERP|NEEDED' <<<"$asks"; then
            echo "::error::the server is not a static file"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-server
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  # Everything or nothing: the release and the image are made once every build is there, so the app is
  # never offered a release that lacks its system's program.
  publish:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [desktop, macos, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      SERVER_IMAGE: ghcr.io/sierrasoftworks/letters-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # The image a deployment pulls by the release's version. `latest` stays main as CI last built it.
      - name: Publish the server's image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/image"
          cp dist/letters-server-x86_64-unknown-linux-musl "$RUNNER_TEMP/image/letters-server"
          chmod 755 "$RUNNER_TEMP/image/letters-server"
          cp /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/image/"
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GHCR_TOKEN"
          docker build --file apps/letters-server/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=${VERSION#v}" \
            --tag "$SERVER_IMAGE:${VERSION#v}" "$RUNNER_TEMP/image"
          docker push "$SERVER_IMAGE:${VERSION#v}"

      # A version with a suffix, as 1.2.0-rc.1, is a prerelease, which the app does not offer.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" dist/* --verify-tag --generate-notes --title "Letters ${VERSION#v}" \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
